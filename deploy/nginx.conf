# Existing Cloudflare Tunnel reaches Nginx through loopback port 8080.
server {
    listen 127.0.0.1:8080;
    server_name learn.nix.zone;
    client_max_body_size 16m;
    client_body_timeout 15s;

    if ($http_x_forwarded_proto = http) {
        return 308 https://learn.nix.zone$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host learn.nix.zone;
        proxy_set_header X-LH-Client-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
    }

    # Never log passwords, request bodies, cookies or OAuth query parameters.
    access_log off;
    error_log /var/log/nginx/learn.error.log warn;
}
